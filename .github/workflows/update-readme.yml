name: Update Profile README

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # 30 min after the portfolio rebuilds projects.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node update-readme.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync projects from abhinesh.codes"
          # Replay on top of the latest main if it moved while we ran
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed, retrying…"
            sleep $((attempt * 5))
          done
          exit 1
